schema_version: 1

context:
  name: aiohue
  version: "4.9.1"
  python_min: "3.11"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.io/packages/source/${{ name[0] }}/${{ name }}/aiohue-${{ version }}.tar.gz
  sha256: c56c22e046e3055e9e71b45db82692c1b8676ab561d4f8f82b8df0771fa744d5

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - aiohttp
    - asyncio-throttle
    - awesomeversion

tests:
  - python:
      imports:
        - aiohue
      pip_check: true
      python_version: ${{ python_min }}.*

about:
  summary: Python module to talk to Philips Hue.
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/home-assistant-libs/aiohue

extra:
  recipe-maintainers:
    - pavelzw
